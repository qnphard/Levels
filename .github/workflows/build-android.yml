name: Build Android APK

# Release JS bundles read EXPO_PUBLIC_* at build time (no .env on the runner).
# Add these names under: Repo → Settings → Secrets and variables → Actions → New repository secret
# Use the same values as your local .env (see .env.example). Missing secrets = empty strings in the APK
# and production will show FirebaseConfigScreen instead of the app.

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches:
      - main
      - master
      - levels-updated

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_GEMINI_MODEL: ${{ secrets.EXPO_PUBLIC_GEMINI_MODEL }}
      EXPO_PUBLIC_TTS_API_URL: ${{ secrets.EXPO_PUBLIC_TTS_API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Warn if Firebase secrets missing
        run: |
          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ] || [ -z "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" ] || [ -z "$EXPO_PUBLIC_FIREBASE_APP_ID" ]; then
            echo "::warning::Firebase EXPO_PUBLIC_* secrets are not all set. The APK will not load the main app in production until you add repository secrets (see workflow header comment)."
          else
            echo "Firebase public env present for bundle (keys not printed)."
          fi

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          # Remove large pre-installed packages to free space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          # Recreate android directory with proper permissions for SDK setup
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R $USER:$USER /usr/local/lib/android
          echo "=== After cleanup ==="
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo CLI
        run: npm install -g @expo/cli

      - name: Prebuild Android (if needed)
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder does not exist, running full prebuild..."
            npx expo prebuild --platform android --skip-dependency-update react-native,react
          else
            echo "Android folder exists, will run prebuild in next step for autolinking"
          fi

      - name: Prebuild Android (sync config)
        run: |
          # Run expo prebuild to sync native config (android folder already exists from repo)
          # Note: prebuild does not create android/build/ - that is created by Gradle.
          # autolinking.json is created in the Build step after gradlew clean.
          echo "Running expo prebuild to sync native config..."
          npx expo prebuild --platform android --skip-dependency-update react-native,react
          echo "Prebuild finished. android/build/ and autolinking.json will be created during Gradle build."

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew
        working-directory: ${{ github.workspace }}

      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p android/app
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Disable PNG crunching to avoid AAPT errors
        run: |
          # Add aaptOptions to disable PNG crunching for large assets
          if [ -f "android/app/build.gradle" ]; then
            # Check if aaptOptions already exists
            if ! grep -q "aaptOptions" android/app/build.gradle; then
              # Insert aaptOptions into the android block
              sed -i '/android {/a\    aaptOptions {\n        cruncherEnabled = false\n    }' android/app/build.gradle
            fi
          fi
          echo "=== Modified build.gradle ==="
          head -50 android/app/build.gradle

      - name: Build Universal APK
        run: |
          cd android
          ./gradlew clean
          # After clean, android/build is removed - recreate autolinking file required by generateAutolinkingPackageList
          mkdir -p build/generated/autolinking
          echo '{"dependencies":[]}' > build/generated/autolinking/autolinking.json
          # Build universal APK with PNG crunching disabled
          ./gradlew assembleRelease -x lint -x test --no-daemon
          # Also try to build bundle and convert to universal APK if needed
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Find APK
        id: find_apk
        run: |
          # Look for universal APK first, then any APK
          UNIVERSAL_APK=$(find android/app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)
          if [ -n "$UNIVERSAL_APK" ]; then
            APK_PATH="$UNIVERSAL_APK"
          else
            # Find the largest APK (likely universal or main architecture)
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \; | sort -k5 -hr | head -n 1 | awk '{print $NF}')
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found!"
            echo "Checking directory contents:"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Verify APK
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file does not exist!"
            exit 1
          fi
          APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH" 2>/dev/null || echo "0")
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "Error: APK file is too small ($APK_SIZE bytes), likely corrupted!"
            exit 1
          fi
          echo "APK Size: $APK_SIZE bytes"
          # Verify APK is a valid ZIP file
          unzip -t "$APK_PATH" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "Error: APK is not a valid ZIP file!"
            exit 1
          fi
          echo "APK verification passed!"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Get APK info
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          echo "APK Size: $(du -h $APK_PATH | cut -f1)"
          echo "APK Path: $APK_PATH"

